name: Release Ark Binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (e.g. v0.4.0)'
        required: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -count=1 ./...

      - name: Build cross-platform binaries
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          VER="${TAG#v}"
          mkdir -p dist

          build_target() {
            GOOS="$1" GOARCH="$2" OUT="$3"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "-s -w -X ark/internal/update.ArkVersion=${VER}" \
              -o "dist/${OUT}" ./cmd/ark
          }

          build_target windows amd64 ark-windows-amd64.exe
          build_target linux amd64 ark-linux-amd64
          build_target linux arm64 ark-linux-arm64
          build_target darwin arm64 ark-darwin-arm64

          cd dist
          sha256sum ark-* > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/ark-windows-amd64.exe
            dist/ark-linux-amd64
            dist/ark-linux-arm64
            dist/ark-darwin-arm64
            dist/checksums.txt
