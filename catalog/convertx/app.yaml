version: 1
id: convertx
name: ConvertX
category: tools
description: Convert documents, images, audio, and video offline.
icon: refresh-cw.svg
image: c4illin/convertx:latest
port: 3000
proxy: port
env:
  ALLOW_UNAUTHENTICATED: "true"
  HTTP_ALLOWED: "true"
  JWT_SECRET: "ark-local-convertx-secret"
healthcheck: /
lan: read
memory_mb: 512
