version: 1
id: kiwix
name: Kiwix
category: knowledge
description: Browse offline Wikipedia, medical, and ZIM reference archives.
icon: kiwix.svg
image: ghcr.io/kiwix/kiwix-serve:3.7.0
command:
  - "--urlRootLocation"
  - "/a/kiwix"
  - "--monitorLibrary"
  - "--library"
  - "/data/zim/library.xml"
port: 8080
proxy: path
volumes:
  - "zim:/data/zim:ro"
healthcheck: /
lan: read
memory_mb: 512
