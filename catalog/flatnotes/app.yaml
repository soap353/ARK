version: 1
id: flatnotes
name: Flatnotes
category: knowledge
description: Fast personal markdown notebook stored locally on disk.
icon: edit.svg
image: dullage/flatnotes:latest
port: 8080
proxy: port
volumes:
  - "notes:/data:rw"
env:
  FLATNOTES_PATH: /data
  FLATNOTES_AUTH_TYPE: none
healthcheck: /
lan: admin
memory_mb: 256
