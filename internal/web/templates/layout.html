{{ define "layout" }}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }} — Ark Almanac</title>
  <link rel="icon" type="image/png" href="/static/ark-logo.png">
  <link rel="stylesheet" href="/static/ark.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <div class="mobile-bar">
    <a href="/" style="display:flex;align-items:center;gap:0.5rem;text-decoration:none;color:var(--color-sidebar-text);">
      <span class="brand-title" style="font-size:18px;">Ark</span>
      <img src="/static/ark-logo.png" alt="Ark" style="width:26px;height:26px;border-radius:6px;object-fit:cover;">
    </a>
    <button type="button" class="btn" style="min-height:36px;padding:0.25rem 0.75rem;background:var(--color-sidebar-surface);color:var(--color-sidebar-text);border-color:var(--color-sidebar-border);" onclick="toggleSidebar()" aria-label="Toggle navigation menu">Menu</button>
  </div>

  <div id="sidebar-backdrop" class="sidebar-backdrop" onclick="toggleSidebar()"></div>

  <div class="app-shell">
    <aside id="ark-sidebar" class="sidebar" role="navigation" aria-label="Main Sidebar Navigation">
      <a href="/" class="sidebar-brand" style="justify-content:space-between;">
        <div>
          <div class="brand-title">Ark</div>
          <div class="brand-sub">Field Almanac</div>
        </div>
        <img src="/static/ark-logo.png" alt="Ark" style="width:36px;height:36px;border-radius:8px;object-fit:cover;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,0.28);">
      </a>

      <nav class="sidebar-nav">
        <div>
          <div class="nav-section-label">Archive</div>
          <div class="nav-list">
            <a href="/" class="sidebar-link {{ if eq .ActiveNav "home" }}active{{ end }}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              <span>Home</span>
            </a>
            <a href="/library" class="sidebar-link {{ if eq .ActiveNav "library" }}active{{ end }}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
              <span>Library</span>
            </a>
            <a href="/kiwix" class="sidebar-link {{ if eq .ActiveNav "kiwix" }}active{{ end }}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/><path d="M11 8v6"/></svg>
              <span>Kiwix Catalog</span>
            </a>
            <a href="/get-content" class="sidebar-link {{ if eq .ActiveNav "get-content" }}active{{ end }}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              <span>Get Content</span>
            </a>
            <a href="/field-guide" class="sidebar-link {{ if eq .ActiveNav "field-guide" }}active{{ end }}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
              <span>Remedy</span>
            </a>
          </div>
        </div>

        <div>
          <div class="nav-section-label">Tools &amp; Services</div>
          <div class="nav-list">
            <a href="/apps" class="sidebar-link {{ if eq .ActiveNav "apps" }}active{{ end }}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
              <span>Apps</span>
            </a>
            <a href="/maps" class="sidebar-link {{ if eq .ActiveNav "maps" }}active{{ end }}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
              <span>Maps</span>
            </a>
            <a href="/ask" class="sidebar-link {{ if eq .ActiveNav "ask" }}active{{ end }}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              <span>Ask AI</span>
            </a>
            <a href="/tools" class="sidebar-link {{ if eq .ActiveNav "tools" }}active{{ end }}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="10" y2="10"/><line x1="14" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="10" y2="14"/><line x1="14" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="16" y2="18"/></svg>
              <span>Calculators</span>
            </a>
            <a href="/lan-drop" class="sidebar-link {{ if eq .ActiveNav "lan-drop" }}active{{ end }}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
              <span>LAN Drop</span>
            </a>
          </div>
        </div>

        {{ if .IsLocal }}
        <div>
          <div class="nav-section-label">Command</div>
          <div class="nav-list">
            <a href="/system" class="sidebar-link {{ if eq .ActiveNav "system" }}active{{ end }}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
              <span>System</span>
            </a>
            <a href="/settings" class="sidebar-link {{ if eq .ActiveNav "settings" }}active{{ end }}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
              <span>Settings</span>
            </a>
          </div>
        </div>
        {{ end }}
      </nav>
    </aside>

    <div class="main-column">
      <main id="main" class="container" role="main">
        {{ template "content" . }}
      </main>
    </div>
  </div>

  <div id="ark-dl-toast-wrap" aria-live="polite"></div>

  <script>
    window.ARK_IS_LOCAL = {{ if .IsLocal }}true{{ else }}false{{ end }};
    function toggleSidebar() {
      var sb = document.getElementById('ark-sidebar');
      var bd = document.getElementById('sidebar-backdrop');
      if (sb && bd) {
        sb.classList.toggle('open');
        bd.classList.toggle('open');
      }
    }

    function arkShowDownloadToast(text) {
      var wrap = document.getElementById('ark-dl-toast-wrap');
      if (!wrap) return;
      var badge = document.createElement('div');
      badge.className = 'ark-dl-toast';
      var dot = document.createElement('span');
      dot.className = 'ark-dl-toast-dot';
      var txt = document.createElement('span');
      txt.textContent = text;
      badge.appendChild(dot);
      badge.appendChild(txt);
      wrap.appendChild(badge);
      setTimeout(function() {
        badge.classList.add('ark-toast-exit');
        setTimeout(function() {
          if (badge.parentNode) badge.parentNode.removeChild(badge);
        }, 300);
      }, 4700);
    }

    var _arkSyncTimer = null;
    function arkSyncDownloadButtons() {
      var forms = document.querySelectorAll('form[action="/api/jobs"], form[action="/api/maps/extract"]');
      if (!forms || forms.length === 0) return;
      if (!window.ARK_IS_LOCAL) {
        forms.forEach(function(form) {
          var btn = form.querySelector('button[type="submit"]');
          if (btn) {
            btn.disabled = true;
            btn.title = 'Downloads are only available on the host computer';
          }
        });
        return;
      }
      fetch('/api/jobs')
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(data) {
          if (!data || !Array.isArray(data.jobs)) return;
          var byTarget = {};
          var hasActive = false;
          for (var i = data.jobs.length - 1; i >= 0; i--) {
            var j = data.jobs[i];
            if (!j || !j.Target) continue;
            byTarget[j.Target] = j.Status;
            if (j.Status === 'pending' || j.Status === 'running') hasActive = true;
          }
          forms.forEach(function(form) {
            if (form.querySelector('#url-input')) return;
            var btn = form.querySelector('button[type="submit"]');
            if (!btn) return;
            var action = form.getAttribute('action') || '';
            var tEl = action === '/api/maps/extract' ? form.querySelector('[name="slug"]') : form.querySelector('[name="target"]');
            if (!tEl || !tEl.value) return;
            var st = byTarget[tEl.value];
            if (st === 'pending' || st === 'running') {
              btn.textContent = 'Downloading...';
              btn.disabled = true;
              hasActive = true;
            } else if (st === 'done') {
              btn.textContent = 'Downloaded';
              btn.classList.remove('btn-primary');
              btn.disabled = false;
            }
          });
          clearTimeout(_arkSyncTimer);
          if (hasActive) {
            _arkSyncTimer = setTimeout(arkSyncDownloadButtons, 2500);
          }
        })
        .catch(function() {});
    }

    document.addEventListener('DOMContentLoaded', arkSyncDownloadButtons);

    function arkSubmitDownloadAjax(form, action) {
      var btn = form.querySelector('button[type="submit"]');
      var origText = btn ? btn.textContent.trim() : 'Download';
      var typeEl = form.querySelector('[name="type"]');
      var targetEl = form.querySelector('[name="target"]');
      var slugEl = form.querySelector('[name="slug"]');
      var dlTarget = action === '/api/maps/extract' ? (slugEl ? slugEl.value : '') : (targetEl ? targetEl.value : '');
      var itemLabel = form.getAttribute('data-dl-label') || '';
      if (!itemLabel) {
        var card = form.closest('.collection-card, tr, .archive-card');
        var heading = card ? card.querySelector('h3, strong') : null;
        if (heading && heading.textContent.trim()) {
          itemLabel = heading.textContent.trim();
        } else if (targetEl && targetEl.type !== 'hidden') {
          itemLabel = dlTarget;
        } else {
          itemLabel = origText.replace(/^(Download|Re-download|Queue Download)\s*/i, '').trim() || dlTarget;
        }
      }

      if (btn) {
        btn.textContent = 'Downloading...';
        btn.disabled = true;
      }

      var fd = new FormData(form);
      fd.set('ajax', '1');
      fetch(action, {
        method: 'POST',
        headers: {
          'Accept': 'application/json',
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: new URLSearchParams(fd).toString()
      })
        .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
        .then(function(res) {
          if (!res.ok || (res.data && res.data.status === 'insufficient')) {
            alert((res.data && (res.data.message || res.data.error)) || 'Download failed.');
            if (btn) {
              btn.textContent = origText;
              btn.disabled = false;
            }
            return;
          }
          arkShowDownloadToast('Downloading ' + itemLabel);
          if (typeEl && targetEl && targetEl.type !== 'hidden') {
            targetEl.value = '';
            if (btn) {
              btn.textContent = origText;
              btn.disabled = false;
            }
          }
          clearTimeout(_arkSyncTimer);
          _arkSyncTimer = setTimeout(arkSyncDownloadButtons, 1500);
        })
        .catch(function() {
          if (btn) {
            btn.textContent = origText;
            btn.disabled = false;
          }
        });
    }

    document.addEventListener('submit', function(ev) {
      var form = ev.target;
      if (!form || form.tagName !== 'FORM') return;
      var action = form.getAttribute('action') || '';
      if (action !== '/api/jobs' && action !== '/api/maps/extract') return;

      var typeEl = form.querySelector('[name="type"]');
      var targetEl = form.querySelector('[name="target"]');
      var slugEl = form.querySelector('[name="slug"]');
      var sizeEl = form.querySelector('[name="size_bytes"]');
      var dlType = action === '/api/maps/extract' ? 'map_extract' : (typeEl ? typeEl.value : '');
      var dlTarget = action === '/api/maps/extract' ? (slugEl ? slugEl.value : '') : (targetEl ? targetEl.value : '');
      if (!dlType || !dlTarget) return;

      ev.preventDefault();
      var qs = '/api/storage/check-space?type=' + encodeURIComponent(dlType) + '&target=' + encodeURIComponent(dlTarget);
      if (sizeEl && sizeEl.value) {
        qs += '&size_bytes=' + encodeURIComponent(sizeEl.value);
      }

      fetch(qs)
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(res) {
          if (res && res.status === 'insufficient') {
            alert(res.message || 'Not enough free disk space for this download.');
            return;
          }
          if (res && res.status === 'warn') {
            if (!confirm((res.message || 'This download uses a large portion of your free disk space.') + '\n\nProceed with download anyway?')) {
              return;
            }
          }
          arkSubmitDownloadAjax(form, action);
        })
        .catch(function() {
          arkSubmitDownloadAjax(form, action);
        });
    });
  </script>
</body>
</html>
{{ end }}
